# Local infrastructure for TaskFlow.
# Postgres and a local OIDC provider. API and frontend containers remain a later increment.
#
#   docker compose up -d postgres keycloak
#   docker compose ps                 # see what's running
#   docker compose down               # stop (keeps data in the named volume)
#   docker compose down -v            # stop AND wipe the data volume

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_pwd
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Lets `depends_on: condition: service_healthy` work later for the API.
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: taskflow-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: taskflow_admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/taskflow-realm.json:/opt/keycloak/data/import/taskflow-realm.json:ro

volumes:
  taskflow_pgdata:
  keycloak_data:
