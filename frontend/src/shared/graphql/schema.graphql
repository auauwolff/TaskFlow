schema {
  query: TaskQueries
  mutation: TaskMutations
}

type TaskQueries {
  task(id: UUID!): TaskItemDto! @cost(weight: "10")
  tasks(projectId: UUID!): [TaskItemDto!]! @cost(weight: "10")
}

type TaskMutations {
  createTask(input: CreateTaskInput!): TaskItemDto! @cost(weight: "10")
  assignTask(id: UUID!, input: AssignTaskInput!): TaskItemDto!
    @cost(weight: "10")
  completeTask(id: UUID!): TaskItemDto! @cost(weight: "10")
}

type TaskItemDto {
  id: UUID!
  projectId: UUID!
  title: String!
  description: String
  status: TaskItemStatus!
  priority: TaskPriority!
  assigneeId: UUID
  createdAt: DateTime!
  completedAt: DateTime
}

input AssignTaskInput {
  assigneeId: UUID!
}

input CreateTaskInput {
  projectId: UUID!
  title: String!
  priority: TaskPriority!
  description: String
}

enum TaskItemStatus {
  TODO
  IN_PROGRESS
  DONE
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION
